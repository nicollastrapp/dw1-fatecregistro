<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes de cores no Bootstrap</title>
    <!-- Importação do CSS do Bootstrap pelo site "Bootstrap CDN"-->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1>Cores no Bootstrap</h1>

    <p class="h3 text-muted">muted</p>
    <p class="h2 text-primary">primary</p>
    <p class="h3 text-success">success</p>
    <p class="h3 text-info">info</p>
    <p class="h3 text-warning">warning</p>
    <p class="h3 text-danger">danger</p>
    


    <!-- Importação do JavaScript do Bootstrap pelo site "Bootstrap CDN" -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
